<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Virtual (6 Foto)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #500014;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background-color: #6a0d27;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f1d592;
            margin-bottom: 6px; 
        }

        .status-text {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: #ebd292;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .booth-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 18px auto;
            height: 0;
            padding-bottom: 150%; 
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            z-index: 1;
        }

        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #preview-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 3;
            display: none;
        }

        .frame-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill !important;
            pointer-events: none;
            z-index: 2;
        }

        .live-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            
            padding-top: 5.6%;
            padding-bottom: 23.9%;
            padding-left: 5.2%;
            padding-right: 5.2%;

            row-gap: 2.0%;
            column-gap: 8.6%;
            
            box-sizing: border-box;
            pointer-events: none;
        }

        .grid-box {
            width: 100%;
            height: 100%;
            border-radius: 0px;
            background-color: #000;
            display: block;
        }

        .btn-action {
            font-family: 'Poppins', sans-serif;
            background-color: #f1d592;
            color: #500014;
            border: none;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            margin: 8px 0;
            width: 100%;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-action:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
        }

        .btn-back {
            background-color: transparent;
            color: #f1d592;
            border: 1px solid #f1d592;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Photobooth Virtual</h2>
        <div id="status" class="status-text">Siap untuk 6 foto!</div>

        <div class="booth-wrapper">
            <video id="webcam" autoplay playsinline muted style="display: none;"></video>
    
            <div id="live-grid" class="live-grid">
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
            </div>

            <canvas id="preview-canvas" style="display: none;"></canvas>
            <img src="frame.png" id="frame-overlay" class="frame-img" alt="Frame">
        </div>

        <a id="snap-btn" class="btn-action">📸 Mulai Sesi (6 Foto)</a>
        <a id="download-btn" class="btn-action" style="display: none;">⬇️ Download Hasil Foto</a>
        <a id="reset-btn" class="btn-action btn-secondary" style="display: none;">🔄 Foto Ulang</a>
        <a href="index.html" class="btn-action btn-back">⬅️ Kembali</a>
    </div>

    <script>
    const video = document.getElementById('webcam');
    const frameOverlay = document.getElementById('frame-overlay');
    const previewCanvas = document.getElementById('preview-canvas');
    const snapBtn = document.getElementById('snap-btn');
    const downloadBtn = document.getElementById('download-btn');
    const resetBtn = document.getElementById('reset-btn');
    const statusText = document.getElementById('status');
    const gridCanvases = document.querySelectorAll('.grid-box');
    
    const ctx = previewCanvas.getContext('2d');
    let capturedPhotos = [];
    const totalPhotos = 6;
    let isRunning = false;
    let audioCtx = null;

    // Kooridinat presisi per kotak
    const boxPositions = [
        { x: 0.052, y: 0.056, w: 0.405, h: 0.222 },
        { x: 0.543, y: 0.056, w: 0.405, h: 0.222 },

        { x: 0.052, y: 0.298, w: 0.405, h: 0.222 },
        { x: 0.543, y: 0.298, w: 0.405, h: 0.222 },

        { x: 0.052, y: 0.539, w: 0.405, h: 0.222 },
        { x: 0.543, y: 0.539, w: 0.405, h: 0.222 }
    ];

    function playCameraSound() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);

            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);

                gain2.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.08);
            }, 50);
        } catch(e) {
            console.log("Audio error", e);
        }
    }

    // Mengembalikan ke sistem pratinjau biasa awal
    function drawLiveGrid() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            gridCanvases.forEach(canvas => {
                const gCtx = canvas.getContext('2d');
                
                const rect = canvas.getBoundingClientRect();
                if (canvas.width !== rect.width || canvas.height !== rect.height) {
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                }

                const vW = video.videoWidth;
                const vH = video.videoHeight;
                const cW = canvas.width;
                const cH = canvas.height;

                const videoAspect = vW / vH;
                const canvasAspect = cW / cH;

                let sX = 0, sY = 0, sW = vW, sH = vH;

                if (videoAspect > canvasAspect) {
                    sW = vH * canvasAspect;
                    sX = (vW - sW) / 2;
                } else {
                    sH = vW / canvasAspect;
                    sY = (vH - sH) / 2;
                }

                gCtx.save();
                gCtx.translate(cW, 0);
                gCtx.scale(-1, 1);
                gCtx.drawImage(video, sX, sY, sW, sH, 0, 0, cW, cH);
                gCtx.restore();
            });
        }
        requestAnimationFrame(drawLiveGrid);
    }

    video.addEventListener('play', () => {
        drawLiveGrid();
    });

    navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
    })
    .then((stream) => { 
        video.srcObject = stream; 
        video.play().catch(e => console.log(e));
    })
    .catch((err) => { 
        alert("Akses kamera gagal: " + err); 
    });

    function startSession(e) {
        if(e) e.preventDefault();
        if (isRunning) return;
        
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        isRunning = true;
        snapBtn.style.display = 'none';
        capturedPhotos = [];
        runPhotoLoop();
    }

    snapBtn.onclick = startSession;

    async function runPhotoLoop() {
        for (let i = 1; i <= totalPhotos; i++) {
            for (let countdown = 3; countdown > 0; countdown--) {
                statusText.innerText = `Foto ke-${i} dalam ${countdown}...`;
                await new Promise(r => setTimeout(r, 1000));
            }

            statusText.innerText = `📸 *CEKREK!* (Foto ${i})`;
            playCameraSound();
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 720;
            tempCanvas.height = video.videoHeight || 1280;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.save();
            tempCtx.translate(tempCanvas.width, 0);
            tempCtx.scale(-1, 1);
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            tempCtx.restore();

            capturedPhotos.push(tempCanvas);
            await new Promise(r => setTimeout(r, 800));
        }

        statusText.innerText = "Selesai! Menyusun foto...";
        renderFinalFrame();
    }

    function renderFinalFrame() {
        const width = frameOverlay.naturalWidth || 1200;
        const height = frameOverlay.naturalHeight || 1800;

        previewCanvas.width = width;
        previewCanvas.height = height;

        ctx.clearRect(0, 0, width, height);

        capturedPhotos.forEach((photoCanvas, index) => {
            const pos = boxPositions[index];
            const destX = pos.x * width;
            const destY = pos.y * height;
            const destW = pos.w * width;
            const destH = pos.h * height;

            const imgW = photoCanvas.width;
            const imgH = photoCanvas.height;

            const imgAspect = imgW / imgH;
            const destAspect = destW / destH;

            let srcX = 0, srcY = 0, srcW = imgW, srcH = imgH;

            if (imgAspect > destAspect) {
                srcW = imgH * destAspect;
                srcX = (imgW - srcW) / 2;
            } else {
                srcH = imgW / destAspect;
                srcY = (imgH - srcH) / 2;
            }

            ctx.drawImage(photoCanvas, srcX, srcY, srcW, srcH, destX, destY, destW, destH);
        });

        // Timpa bingkai di paling atas
        ctx.drawImage(frameOverlay, 0, 0, width, height);

        document.getElementById('live-grid').style.display = 'none';
        previewCanvas.style.display = 'block';

        const resultDataUrl = previewCanvas.toDataURL('image/png');

        if (downloadBtn) {
            downloadBtn.href = resultDataUrl;
            downloadBtn.download = `photobooth-aldo-${Date.now()}.png`;
            downloadBtn.style.display = 'block';
        }

        if (resetBtn) {
            resetBtn.style.display = 'block';
        }

        if (statusText) {
            statusText.innerText = "Hasil Foto Siap!";
        }
    }

    resetBtn.onclick = function(e) {
        if(e) e.preventDefault();
        isRunning = false;
        previewCanvas.style.display = 'none';
        document.getElementById('live-grid').style.display = 'grid';
        snapBtn.style.display = 'block';
        downloadBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        statusText.innerText = "Siap untuk 6 foto!";
    };
    </script>
</body>
</html>
