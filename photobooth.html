<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Virtual (6 Foto)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #500014;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background-color: #6a0d27;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f1d592;
            margin-bottom: 6px; 
        }

        /* Status Hitung Mundur / Indikator Foto */
        .status-text {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: #ebd292;
            margin-bottom: 15px;
            min-height: 20px;
        }

        /* Area Wrapper Kamera & Frame */
        .booth-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 18px auto;
            aspect-ratio: 2 / 3; 
            border-radius: 12px;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
            /* Filter cantik pada video webcam */
            filter: brightness(108%) contrast(103%) saturate(105%) sepia(8%);
        }

        #preview-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 3;
            display: none;
        }

        /* Gambar Frame PNG Overlay */
        .frame-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
            z-index: 2;
        }

        /* Container Grid 6 Kotak Presisi */
        .live-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            
            padding-top: 5.8%;
            padding-bottom: 31.5%;
            padding-left: 5.3%;
            padding-right: 5.3%;

            row-gap: 2.2%;
            column-gap: 8.8%;
            
            box-sizing: border-box;
            pointer-events: none;
        }

        .grid-box {
            width: 100%;
            height: 100%;
            border-radius: 2px;
            background-color: #000;
            display: block;
            object-fit: cover;
        }

        /* Tombol Navigasi & Aksi */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button, .btn-download, .btn-back {
            font-family: 'Poppins', sans-serif;
            background-color: #f1d592;
            color: #500014;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: all 0.3s ease;
        }

        button:active, .btn-download:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
        }

        .btn-back {
            background-color: transparent;
            color: #f1d592;
            border: 1px solid #f1d592;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Photobooth Virtual</h2>
        <div id="status" class="status-text">Siap untuk 6 foto!</div>

        <div class="booth-wrapper">
            <!-- Video kamera disembunyikan (digunakan sebagai data stream) -->
            <video id="webcam" autoplay playsinline muted style="display: none;"></video>
    
            <!-- Container 6 Grid untuk Live Preview -->
            <div id="live-grid" class="live-grid">
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
                <canvas class="grid-box"></canvas>
            </div>

            <!-- Canvas Hasil Foto Akhir -->
            <canvas id="preview-canvas" style="display: none;"></canvas>
            
            <!-- Frame Transparan PNG -->
            <img src="frame.png" id="frame-overlay" class="frame-img" alt="Frame">
        </div>

        <div class="btn-group">
            <button id="snap-btn">📸 Mulai Sesi (6 Foto)</button>
            <a id="download-btn" class="btn-download" style="display: none;">⬇️ Download Hasil Foto</a>
            <button id="reset-btn" class="btn-secondary" style="display: none;">🔄 Foto Ulang</button>
            <a href="index.html" class="btn-back">⬅️ Kembali</a>
        </div>
    </div>

    <script>
    const video = document.getElementById('webcam');
    const frameOverlay = document.getElementById('frame-overlay');
    const previewCanvas = document.getElementById('preview-canvas');
    const snapBtn = document.getElementById('snap-btn');
    const downloadBtn = document.getElementById('download-btn');
    const resetBtn = document.getElementById('reset-btn');
    const statusText = document.getElementById('status');
    const gridCanvases = document.querySelectorAll('.grid-box');
    
    const ctx = previewCanvas.getContext('2d');
    let capturedPhotos = [];
    const totalPhotos = 6;

    // Filter Cantik (Beauty Filter String)
    const beautyFilterStr = 'brightness(108%) contrast(103%) saturate(105%) sepia(8%)';

    // Suara Cekrek Instan (Web Audio API)
    function playShutterSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } catch (e) {
            console.log("Audio not allowed or supported yet");
        }
    }

   // GANTI BAGIAN INI SAJA DI SCRIPT-MU:
    const boxPositions = [
        { x: 0.053, y: 0.058, w: 0.403, h: 0.230 }, // Kiri Atas
        { x: 0.544, y: 0.058, w: 0.403, h: 0.230 }, // Kanan Atas
        // Nilai y diturunkan/dikurangi agak banyak biar PASTI naik:
        { x: 0.053, y: 0.285, w: 0.403, h: 0.230 }, // Kiri Tengah (Ubah y ke 0.285)
        { x: 0.544, y: 0.285, w: 0.403, h: 0.230 }, // Kanan Tengah (Ubah y ke 0.285)
        { x: 0.053, y: 0.530, w: 0.403, h: 0.230 }, // Kiri Bawah  (Ubah y ke 0.530)
        { x: 0.544, y: 0.530, w: 0.403, h: 0.230 }  // Kanan Bawah  (Ubah y ke 0.530)
    ];

    // Fungsi menggambar stream kamera ke 6 kotak live grid
    function drawLiveGrid() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            gridCanvases.forEach(canvas => {
                const gCtx = canvas.getContext('2d');
                
                const rect = canvas.getBoundingClientRect();
                if (canvas.width !== rect.width || canvas.height !== rect.height) {
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                }

                const vW = video.videoWidth;
                const vH = video.videoHeight;
                const cW = canvas.width;
                const cH = canvas.height;

                const videoAspect = vW / vH;
                const canvasAspect = cW / cH;

                let sX = 0, sY = 0, sW = vW, sH = vH;

                if (videoAspect > canvasAspect) {
                    sW = vH * canvasAspect;
                    sX = (vW - sW) / 2;
                } else {
                    sH = vW / canvasAspect;
                    sY = (vH - sH) / 2;
                }

                gCtx.save();
                gCtx.filter = beautyFilterStr; // Terapkan filter cantik di preview
                gCtx.translate(cW, 0);
                gCtx.scale(-1, 1);
                gCtx.drawImage(video, sX, sY, sW, sH, 0, 0, cW, cH);
                gCtx.restore();
            });
        }
        requestAnimationFrame(drawLiveGrid);
    }

    video.addEventListener('play', () => {
        drawLiveGrid();
    });

    // Akses Kamera (Kamera Depan Mobile Friendly)
    const constraints = {
        audio: false,
        video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
        }
    };

    navigator.mediaDevices.getUserMedia(constraints)
    .then((stream) => { 
        video.srcObject = stream; 
        video.play().catch(e => console.log("Autoplay blocked:", e));
    })
    .catch((err) => { 
        console.error("Gagal akses kamera: ", err);
        alert("Gagal mengakses kamera. Pastikan memberikan izin kamera di browser HP kamu!"); 
    });

    // Sesi Ambil Foto
    snapBtn.addEventListener('click', async () => {
        snapBtn.style.display = 'none';
        capturedPhotos = [];

        for (let i = 1; i <= totalPhotos; i++) {
            for (let countdown = 3; countdown > 0; countdown--) {
                statusText.innerText = `Foto ke-${i} dalam ${countdown}...`;
                await new Promise(r => setTimeout(r, 1000));
            }

            // Bunyi suara cekrek
            playShutterSound();
            statusText.innerText = `📸 *CEKREK!* (Foto ${i})`;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 600;
            tempCanvas.height = video.videoHeight || 800;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.save();
            tempCtx.filter = beautyFilterStr; // Terapkan filter cantik ke hasil simpan foto
            tempCtx.translate(tempCanvas.width, 0);
            tempCtx.scale(-1, 1);
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            tempCtx.restore();

            capturedPhotos.push(tempCanvas);
            await new Promise(r => setTimeout(r, 800));
        }

        statusText.innerText = "Selesai! Menyusun foto...";
        renderFinalFrame();
    });

    // Render Hasil Akhir ke Canvas
    function renderFinalFrame() {
        const width = frameOverlay.naturalWidth || 1200;
        const height = frameOverlay.naturalHeight || 1800;

        previewCanvas.width = width;
        previewCanvas.height = height;

        ctx.clearRect(0, 0, width, height);

       capturedPhotos.forEach((photoCanvas, index) => {
            const pos = boxPositions[index];
            const destX = pos.x * width;
            const destY = (pos.y * height) - 8;
           // Ditambah sedikit toleransi piksel (+2) agar pasti masuk di belakang lis frame
            const destW = (pos.w * width) + 2;
            const destH = (pos.h * height) + 4;

            const imgW = photoCanvas.width;
            const imgH = photoCanvas.height;

            const imgAspect = imgW / imgH;
            const destAspect = destW / destH;

            let srcX = 0, srcY = 0, srcW = imgW, srcH = imgH;

            if (imgAspect > destAspect) {
                srcW = imgH * destAspect;
                srcX = (imgW - srcW) / 2;
            } else {
                srcH = imgW / destAspect;
                srcY = (imgH - srcH) / 2;
            }

            ctx.drawImage(photoCanvas, srcX, srcY, srcW, srcH, destX - 1, destY - 1, destW, destH);
        });

        // Tempelkan Frame PNG
        ctx.drawImage(frameOverlay, 0, 0, width, height);

        // Tampilkan Preview
        document.getElementById('live-grid').style.display = 'none';
        previewCanvas.style.display = 'block';

        const resultDataUrl = previewCanvas.toDataURL('image/png');

        if (downloadBtn) {
            downloadBtn.href = resultDataUrl;
            downloadBtn.download = `photobooth-aldo-${Date.now()}.png`;
            downloadBtn.style.display = 'block';
        }

        if (resetBtn) {
            resetBtn.style.display = 'block';
        }

        if (statusText) {
            statusText.innerText = "Hasil Foto Siap!";
        }
    }

    // Reset Foto Ulang
    resetBtn.addEventListener('click', () => {
        previewCanvas.style.display = 'none';
        document.getElementById('live-grid').style.display = 'grid';
        snapBtn.style.display = 'block';
        downloadBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        statusText.innerText = "Siap untuk 6 foto!";
    });
    </script>
</body>
</html>
